# A tag vX.Y.Z on main makes a Release with the three installable files attached, after the same
# checks as every push. Nothing is published unless a person pushes a tag.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: The tag matches the version the tree says
        run: |
          v=$(awk -F'\t' '$1=="version"{print $2}' PROVENANCE)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but PROVENANCE says $v"; exit 1; }
      - run: sh .github/ci/check.sh
      - name: Build the three installable files
        run: |
          mkdir -p out && cp extension/vibrobeast.mcpb out/
          (cd plugins/vibrobeast && python3 -m zipfile -c ../../out/vibrobeast.plugin $(ls -A))
          (cd plugins/vibrobeast-skills && python3 -m zipfile -c ../../out/vibrobeast-skills.plugin $(ls -A))
          (cd out && sha256sum * > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "vibrobeast $GITHUB_REF_NAME" \
            --notes "Install: open vibrobeast.mcpb in Claude Desktop, then upload vibrobeast-skills.plugin (Customize, Plugins, Add, Upload plugin). Claude Code: /plugin marketplace add inputloop/vibrobeast. PROVENANCE in the repository names the source commit."
